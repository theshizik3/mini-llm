batch_size: 8

pretrain_lr: 3e-4
sft_lr: 1e-5
min_lr_rate: 0.1

warmup_steps: 500
sched_steps: 500000

device: cuda
dtype: float32
compile: true

log_every: 10
save_every: 20000

sft_init_ckpt: ./path/to/checkpoint.pt
dataset_dir: ./data/tokenized
checkpoints_dir: ./artifacts/checkpoints

eos_token: 2
pad_token: 1
