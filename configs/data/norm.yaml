shard_rows: 65_536 
input_dir: ./data/fetch
output_dir: ./data/norm
datasets:
  - name: IlyaGusev/ru_news
    type: pretrain
    pat: *.jsonl.zst
    max_rows: 1_000_000
    reader: column_zstd_jsonl_reader
    reader_args:
      column: text
    shuffle: true
  - name: IlyaGusev/pikabu
    type: pretrain
    pat: *.jsonl.zst
    max_rows: 1_380_000
    reader: column_zstd_jsonl_reader
    reader_args: 
      column: text_markdown
    shuffle: true
  - name: its5Q/wikireading
    type: pretrain
    pat: *.jsonl.zst
    max_rows: 740_000
    reader: column_zstd_jsonl_reader
    reader_args:
      column: text
    shuffle: true
  - name: cointegrated/taiga_stripped_proza
    type: pretrain
    pat: *.parquet
    max_rows: 141_000
    reader: column_parquet_reader
    reader_args:
      column: text
    shuffle: true
  - name: HuggingFaceFW/finewiki
    type: pretrain
    pat: *.parquet
    max_rows: 65_000
    reader: column_parquet_reader
    reader_args:
      column: text
    shuffle: true
  - name: HuggingFaceFW/fineweb-2
    type: pretrain
    pat: *.parquet
    max_rows: 740_000
    reader: column_parquet_reader
    reader_args:
      column: text
    shuffle: true